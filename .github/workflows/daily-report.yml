name: Täglicher WeLovePilates-Report

# Läuft täglich morgens und kann manuell gestartet werden.
on:
  schedule:
    # 05:00 UTC ≈ 06:00–07:00 Uhr Berlin (je nach Sommer-/Winterzeit)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # um Snapshots (data/) und Dashboard (docs/) zurückzuschreiben

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          python -m playwright install --with-deps chromium

      - name: Monitor ausführen
        env:
          # E-Mail (SMTP)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Google Ads
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Search Console
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Wix Bookings
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
        run: |
          python -m wlp_monitor.main --email-on always

      - name: Ergebnisse committen (Historie + Dashboard)
        run: |
          git config user.name "welovepilates-monitor[bot]"
          git config user.email "monitor@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "chore(report): Tagesreport $(date +%F)"
            git push
          fi
