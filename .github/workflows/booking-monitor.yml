name: Buchungs- & Website-Check

# Häufiger, schlanker Check: Ist die Seite erreichbar und funktioniert die Buchung?
# Schlägt der Job fehl (roter Lauf), benachrichtigt GitHub automatisch.
# Eine E-Mail geht NUR bei Problemen raus (--email-on problems).
on:
  schedule:
    - cron: "0 */3 * * *"   # alle 3 Stunden
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: booking-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          python -m playwright install --with-deps chromium

      - name: Website & Buchung prüfen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python -m wlp_monitor.main \
            --only uptime booking_flow \
            --email-on problems \
            --no-save --no-dashboard \
            --fail-on-error
